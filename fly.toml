# Fly.io deployment. SQLite = exactly ONE machine with ONE volume.
#   fly launch --no-deploy --copy-config --name <your-app>
#   fly volumes create pb_data --region fra --size 1
#   fly secrets set APP_URL=https://<your-app>.fly.dev APP_SECRET=... STRIPE_...=...
#   fly deploy --ha=false
app = "pulseboard"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "20s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_FILE = "/data/pulseboard.db"
  BACKUP_DIR = "/data/backups"
  TRUST_PROXY = "1"

[[mounts]]
  source = "pb_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the machine running: the email outbox worker runs in-process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
